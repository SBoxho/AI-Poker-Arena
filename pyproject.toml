[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-arena"
version = "0.1.0"
description = "AI Poker Arena - explainable AI agents (EBM, XGBoost, Genetic Algorithm) compete at heads-up No-Limit Texas Hold'em."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pokerkit>=0.7.6",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "interpret>=0.7.2",
    "xgboost>=2.1",
    "shap>=0.46",
    "joblib>=1.4",
    "plotly>=5.24",
    "matplotlib>=3.9",
    "streamlit>=1.50",
    "pyarrow>=16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jupyterlab>=4",
    "ipykernel>=6",
    "nbformat>=5",
    "nbconvert>=7",
    "nbclient>=0.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
poker_arena = ["equity/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests that take more than a few seconds (deselect with -m 'not slow')",
]
